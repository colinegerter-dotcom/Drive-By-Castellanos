name: Historical backfill (manual)

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to backfill, space-separated"
        required: true
        default: "2025"
      skip_pitches:
        description: "Skip the Statcast pitch pull (check this if the Parquet file already exists)"
        required: true
        type: boolean
        default: false
      skip_forms:
        description: "Skip form-table computation (leave UNCHECKED for a real backfill)"
        required: true
        type: boolean
        default: false
      skip_postgame:
        description: "Skip postgame (game_results/lineup/conditions), ~28 min. ONLY for a season already loaded; the run aborts if it isn't"
        required: true
        type: boolean
        default: false
      resume:
        description: "Skip games that already have form rows. UNSAFE if the code changed since the interrupted run - re-run clean instead"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline tests
        run: |
          for t in tests/*.py; do echo "== $t"; python "$t" || exit 1; done

      - name: Download existing pitch data
        if: ${{ inputs.skip_pitches }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          for S in ${{ inputs.seasons }}; do
            gh release download "pitches-$S" -p "pitches_$S.parquet" -D data --clobber \
              || echo "no release for $S yet"
          done
          ls -la data || true

      - name: Run backfill
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          ARGS="--seasons ${{ inputs.seasons }}"
          if [ "${{ inputs.skip_pitches }}" = "true" ]; then ARGS="$ARGS --skip-pitches"; fi
          if [ "${{ inputs.skip_forms }}" = "true" ]; then ARGS="$ARGS --skip-forms"; fi
          if [ "${{ inputs.skip_postgame }}" = "true" ]; then ARGS="$ARGS --skip-postgame"; fi
          if [ "${{ inputs.resume }}" = "true" ]; then ARGS="$ARGS --resume"; fi
          echo "Running: python scripts/backfill.py $ARGS"
          python scripts/backfill.py $ARGS

      - name: Upload pitch data to a release
        if: ${{ !inputs.skip_pitches }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for S in ${{ inputs.seasons }}; do
            F="data/pitches_$S.parquet"
            [ -f "$F" ] || { echo "no $F, skipping"; continue; }
            gh release view "pitches-$S" >/dev/null 2>&1 \
              || gh release create "pitches-$S" -t "Pitch data $S" -n "Statcast pitch-level data for $S"
            gh release upload "pitches-$S" "$F" --clobber
            echo "uploaded $F ($(du -h "$F" | cut -f1))"
          done
