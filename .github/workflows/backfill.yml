name: Historical backfill (manual)

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to backfill, space-separated (e.g. 2025 or 2021 2022 2023 2024 2025)"
        required: true
        default: "2025"
      skip_pitches:
        description: "Skip the Statcast pitch-level pull"
        required: true
        type: boolean
        default: false
      skip_forms:
        description: "Skip form-table computation (check this for a pitches-only load)"
        required: true
        type: boolean
        default: true
      resume:
        description: "Skip games that already have form rows (only safe if the code hasn't changed since the interrupted run)"
        required: true
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill
        env:
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SUPABASE_DB_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SUPABASE_DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          ARGS="--seasons ${{ inputs.seasons }}"
          if [ "${{ inputs.skip_pitches }}" = "true" ]; then ARGS="$ARGS --skip-pitches"; fi
          if [ "${{ inputs.skip_forms }}" = "true" ]; then ARGS="$ARGS --skip-forms"; fi
          if [ "${{ inputs.resume }}" = "true" ]; then ARGS="$ARGS --resume"; fi
          echo "Running: python scripts/backfill.py $ARGS"
          python scripts/backfill.py $ARGS
